name: Publicar panel
on:
  push: { branches: [main] }
  schedule:
    - cron: '17 * * * *' # cada hora: lluvia SMN + avisos (el pronóstico se recalcula cada 2 h)
    - cron: '7,27,37,47,57 * * * *' # cada 10 min: solo avisos SMN (los de corto plazo duran 1–2 h)
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Mandar un resumen por Telegram aunque no haya alerta'
        type: boolean
        default: false
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir _site && cp -r index.html app.js style.css manifest.webmanifest icon.svg lib _site/
      - run: node scripts/build-data.mjs _site
        env:
          REUSE_FORECAST: ${{ github.event_name == 'schedule' && 'https://juampipar.github.io/alerta-tornados/data/forecast.json' || '' }}
      # Lluvia pronosticada del modelo WRF del SMN (4 km). Solo se recalcula cuando sale una corrida nueva.
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: scripts/requirements.txt }
      - name: Lluvia del modelo SMN
        continue-on-error: true # si falla, el panel se publica igual (sin esa capa)
        timeout-minutes: 15
        run: |
          pip install -q -r scripts/requirements.txt
          python scripts/build-wrf.py _site
        env:
          PUBLISHED_WRF: https://juampipar.github.io/alerta-tornados/data/wrf/
          REUSE_ONLY: ${{ github.event.schedule == '7,27,37,47,57 * * * *' && '1' || '' }}
      # Alertas Telegram: el estado (qué ya se envió) se guarda en la caché de Actions entre corridas.
      - uses: actions/cache/restore@v4
        with: { path: .alert-state, key: 'alert-state-${{ github.run_id }}', restore-keys: alert-state- }
      - name: Alerta Telegram
        continue-on-error: true # si falla, el panel se publica igual
        run: node scripts/alert.mjs _site
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '60' }}
          RADIUS_KM: ${{ vars.RADIUS_KM || '200' }}
          ALERT_STATE: .alert-state/state.json
          TEST: ${{ inputs.prueba && '1' || '' }}
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with: { path: .alert-state, key: 'alert-state-${{ github.run_id }}' }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
