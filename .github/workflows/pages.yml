name: Publicar panel
on:
  push: { branches: [main] }
  schedule:
    - cron: '17 * * * *' # respaldo: GitHub lo corre cuando puede (a veces cada varias horas)
  # El vigía (vigia.yml) lo lanza cada 30 min con auto=true y es el que manda los avisos de Telegram.
  workflow_dispatch:
    inputs:
      auto:
        description: 'Lanzado por el vigía (reusa el pronóstico si tiene menos de 2 h)'
        type: boolean
        default: false
      prueba:
        description: 'Mandar un resumen por Telegram aunque no haya alerta'
        type: boolean
        default: false
      repetir:
        description: 'Repetir un momento pasado en modo caza desde Leones (hora UTC, ej. 2026-11-03T21:40). No publica el panel.'
        type: string
        default: ''
permissions: { contents: write, pages: write, id-token: write } # contents: write solo para guardar el historial en la rama datos
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir _site && cp -r index.html app.js style.css manifest.webmanifest icon.svg lib _site/
      - run: node scripts/build-data.mjs _site
        env:
          REUSE_FORECAST: ${{ (github.event_name == 'schedule' || inputs.auto) && 'https://juampipar.github.io/alerta-tornados/data/forecast.json' || '' }}
          REUSE_MODELS: ${{ (github.event_name == 'schedule' || inputs.auto) && 'https://juampipar.github.io/alerta-tornados/data/modelos.json' || '' }}
      # Lluvia pronosticada del modelo WRF del SMN (4 km). Solo se recalcula cuando sale una corrida nueva.
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: scripts/requirements.txt }
      - name: Lluvia del modelo SMN e imágenes para la IA
        continue-on-error: true # si falla, el panel se publica igual (sin esa capa)
        timeout-minutes: 15
        run: |
          pip install -q -r scripts/requirements.txt
          python scripts/build-wrf.py _site
          python scripts/build-images.py _site || echo 'imágenes para la IA: falló, sigo sin ellas'
          python scripts/nowcast.py _site || echo 'núcleos del satélite: falló'
        env:
          PUBLISHED_WRF: https://juampipar.github.io/alerta-tornados/data/wrf/
          NOWCAST_AT: ${{ inputs.repetir }}
          REPLAY_AT: ${{ inputs.repetir }}
      # Resumen para la IA (data/brief.json). Los avisos de Telegram los manda el vigía (vigia.yml); acá solo se
      # envía si es una prueba o una repetición pedida a mano. El estado de acá es descartable.
      - name: Resumen (y prueba de Telegram)
        continue-on-error: true # si falla, el panel se publica igual
        run: node scripts/alert.mjs _site
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '60' }}
          RADIUS_KM: ${{ vars.RADIUS_KM || '200' }}
          ALERT_STATE: .estado-panel/state.json
          DRY_RUN: ${{ (inputs.prueba || inputs.repetir) && '' || '1' }}
          TEST: ${{ inputs.prueba && '1' || '' }}
          REPLAY_AT: ${{ inputs.repetir }}
      # Historial: qué se pronosticó y qué pasó (avisos SMN, satélite, tus reportes). Se guarda en la rama "datos".
      - name: Historial
        if: ${{ !inputs.repetir }}
        continue-on-error: true # si falla, el panel se publica igual
        run: |
          if git fetch -q --depth=1 origin datos; then git worktree add -q -B datos .datos FETCH_HEAD; else git worktree add -q --orphan -b datos .datos; fi
          node scripts/historial.mjs _site .datos
          cp .datos/entrenamiento/modelo.json _site/data/modelo-tornado.json 2>/dev/null || true # modelo entrenado (si ya hay)
          cd .datos
          git add historial.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Historial $(date -u +%FT%H:%MZ)"
            git push -q origin datos
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.repetir }} # una repetición no publica el panel (tendría datos viejos)
        with: { path: _site }
      - id: d
        if: ${{ !inputs.repetir }}
        uses: actions/deploy-pages@v4
