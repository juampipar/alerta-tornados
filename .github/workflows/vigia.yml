name: Vigía (avisos cada 10 min)
# GitHub corre los cron "cada 10 min" cuando puede: con mucha carga, cada 1 a 6 horas. Por eso esta tarea queda
# prendida ~5 h 30 min revisando cada 10 minutos (avisos del SMN, satélite, rayos, modo caza) y manda los avisos de
# Telegram. Al terminar se vuelve a lanzar sola. Cada 30 min además actualiza el panel (pages.yml con auto=true).
# El pronóstico pesado lo sigue calculando el panel cada 2 h (cuota de Open-Meteo); acá se usa el publicado.
on:
  workflow_dispatch:
  schedule:
    - cron: '11 */3 * * *' # respaldo: si la cadena se corta, la retoma
permissions: { contents: read, actions: write }
concurrency: { group: vigia, cancel-in-progress: false }
jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: scripts/requirements.txt }
      - run: pip install -q -r scripts/requirements.txt
      # Qué ya se avisó (para no repetir), modo caza y aciertos de las alertas: se guarda entre corridas.
      - uses: actions/cache/restore@v4
        with: { path: .alert-state, key: 'alert-state-${{ github.run_id }}', restore-keys: alert-state- }
      - name: Revisar cada 10 minutos
        run: |
          PANEL=https://juampipar.github.io/alerta-tornados/data
          fin=$(( $(date +%s) + 325 * 60 ))
          n=0
          mkdir -p _v/data/wrf
          while [ "$(date +%s)" -lt "$fin" ]; do
            t0=$(date +%s); n=$((n + 1))
            echo "::group::Vuelta $n ($(TZ=America/Argentina/Cordoba date +%H:%M) h)"
            # Pronóstico, modelos y lluvia del modelo SMN: los que publicó el panel (si falla, quedan los anteriores).
            for f in forecast modelos wrf/meta; do curl -sfo "_v/data/$f.json.tmp" "$PANEL/$f.json" && mv "_v/data/$f.json.tmp" "_v/data/$f.json"; done
            for dh in 1 3; do k=$(TZ=America/Argentina/Cordoba date -d "+$dh hour" +%Y-%m-%dT%H); curl -sfo "_v/data/wrf/$k.png" "$PANEL/wrf/$k.png" || true; done
            ONLY_SMN=1 node scripts/build-data.mjs _v || echo 'SMN: falló'
            python scripts/nowcast.py _v || echo 'satélite: falló'
            python scripts/build-images.py _v > /dev/null 2>&1 || echo 'imágenes para la IA: fallaron'
            node scripts/alert.mjs _v || echo 'alerta: falló'
            # Cada 30 min, el panel con datos frescos (su cron de GitHub no es confiable).
            if [ $((n % 3)) -eq 0 ]; then gh workflow run pages.yml --ref main -f auto=true || echo 'no pude lanzar el panel'; fi
            echo "::endgroup::"
            espera=$(( 600 - ($(date +%s) - t0) ))
            if [ "$espera" -gt 0 ]; then sleep "$espera"; fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '60' }}
          RADIUS_KM: ${{ vars.RADIUS_KM || '200' }}
          ALERT_STATE: .alert-state/state.json
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with: { path: .alert-state, key: 'alert-state-${{ github.run_id }}' }
      # Se relanza sola: así siempre hay un vigía prendido.
      - name: Seguir vigilando
        if: always()
        run: gh workflow run vigia.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
